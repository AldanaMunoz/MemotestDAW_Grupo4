<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memotest Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>


<body>
  <header class="encabezado">
    <h1 class="titulo-principal">Memotest Mundial 2026</h1>
    <nav class="navegacion">
      <a href="index.html" class="enlace-nav enlace-nav--activo">Jugar</a>
      <a href="contacto.html" class="enlace-nav">Contacto</a>
      <button type="button" id="botonTema" class="boton-tema" aria-label="Cambiar modo claro u oscuro">🌙</button>
    </nav>
  </header>

  <main class="contenido-principal">
    <section id="pantallaInicio" class="pantalla-inicio">
    </section>
      <p class="texto-intro">Ingresá su nombre, elija el nivel de dificultad y encuentre los pares de banderas del Mundial 2026.</p>

      <div class="campo-formulario">
        <label for="campoNombre" class="etiqueta-campo">Nombre del jugador</label>
        <input type="text" id="campoNombre" class="entrada-texto" maxlength="20" placeholder="Ej: Aldana">
        <p id="errorNombre" class="mensaje-error oculto"></p>
      </div>

      <fieldset class="campo-formulario campo-nivel">
        <legend class="etiqueta-campo">Nivel de dificultad</legend>
        <div class="opciones-nivel">
          
          <label class="opcion-nivel">
            <input type="radio" name="nivel" value="facil">
            Fácil (4x4)
          </label>
          <label class="opcion-nivel">
            <input type="radio" name="nivel" value="medio">
            Medio (5x4)
          </label>
          <label class="opcion-nivel">
            <input type="radio" name="nivel" value="dificil">
            Difícil (6x6)
          </label>
        </div>
        <p id="errorNivel" class="mensaje-error oculto"></p>
      </fieldset>

      <button type="button" id="botonComenzar" class="boton-principal">Comenzar partida</button>
    <section id="pantallaJuego" class="pantalla-juego oculto">
      <div class="panel-estado">
        <p class="dato-estado">Jugador: <span id="valorJugador"></span></p>
        <p class="dato-estado">Nivel: <span id="valorNivel"></span></p>
        <p class="dato-estado">Intentos: <span id="valorIntentos">0</span></p>
        <p class="dato-estado">Errores: <span id="valorErrores">0</span></p>
        <p class="dato-estado">Puntaje: <span id="valorPuntaje">0</span></p>
        <p class="dato-estado">Tiempo: <span id="valorTiempo">00:00</span></p>
      </div>
      <div id="tablero" class="tablero"></div>
    </section>
  </main>

  <footer class="pie-pagina">
    <a href="https://github.com/AldanaMunoz/MemotestDAW_Grupo4.git" target="_blank" rel="noopener noreferrer" class="enlace-externo">Ver código en GitHub</a>
    <a href="https://AldanaMunoz.github.io/MemotestDAW_Grupo4/" target="_blank" rel="noopener noreferrer" class="enlace-externo">Ver sitio publicado</a>
  </footer>

  <script src="../js/validaciones.js"></script>
  <script src="../js/principal.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/tablero.js"></script>
</body>

</html>
