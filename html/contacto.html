<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Memotest Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1 class="titulo-principal">Memotest Mundial 2026</h1>
    <nav class="navegacion">
      <a href="index.html" class="enlace-nav">Jugar</a>
      <a href="contacto.html" class="enlace-nav enlace-nav--activo">Contacto</a>
      <button type="button" id="botonTema" class="boton-tema" aria-label="Cambiar modo claro u oscuro">🌙</button>
    </nav>
  </header>

  <main class="contenido-principal">
    <section id="pantallaContacto" class="pantalla-contacto">
      <p class="texto-intro">¿Encontraste un error o querés dejarnos un comentario? Escribinos.</p>

      <form id="formularioContacto" class="formulario-contacto" novalidate>
        <div class="campo-formulario">
          <label for="campoNombreContacto" class="etiqueta-campo">Nombre</label>
          <input type="text" id="campoNombreContacto" class="entrada-texto">
          <p id="errorNombreContacto" class="mensaje-error oculto"></p>
        </div>

        <div class="campo-formulario">
          <label for="campoMail" class="etiqueta-campo">Mail</label>
          <input type="email" id="campoMail" class="entrada-texto">
          <p id="errorMail" class="mensaje-error oculto"></p>
        </div>

        <div class="campo-formulario">
          <label for="campoMensaje" class="etiqueta-campo">Mensaje</label>
          <textarea id="campoMensaje" class="entrada-texto entrada-textarea" rows="4"></textarea>
          <p id="errorMensaje" class="mensaje-error oculto"></p>
        </div>

        <button type="submit" class="boton-principal">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer class="pie-pagina">
    <a href="https://github.com/AldanaMunoz/MemotestDAW_Grupo4.git" target="_blank" rel="noopener noreferrer" class="enlace-externo">Ver código en GitHub</a>
    <a href="https://AldanaMunoz.github.io/MemotestDAW_Grupo4/" target="_blank" rel="noopener noreferrer" class="enlace-externo">Ver sitio publicado</a>
  </footer>

  <script src="js/tema.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
